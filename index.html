<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast | Weather App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-card">
        <h1>SkyCast</h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." spellcheck="false">
            <button id="getWeatherBtn">Search</button>
        </div>

        <div id="weatherResult" class="result-area">
            <div class="placeholder-text">Enter a city to explore the weather.</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
